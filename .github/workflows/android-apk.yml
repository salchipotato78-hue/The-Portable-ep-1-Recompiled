# Build the arm64 Android APK on GitHub-hosted Windows runners.
# Mirrors build-android-arm64.bat + android/package-arm64.ps1.
# The packaging scripts resolve the repo root from their own location,
# so the checkout can live anywhere (the default workspace is fine).
name: android-apk

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The windows-latest image already ships an Android SDK at ANDROID_HOME.
      # We drive sdkmanager ourselves instead of android-actions/setup-android,
      # which fails on the legacy 'tools' package.
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          $sdkmanager = Get-ChildItem (Join-Path $sdkRoot "cmdline-tools") -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under $sdkRoot" }
          1..50 | ForEach-Object { 'y' } | & $sdkmanager.FullName --licenses | Out-Host
          & $sdkmanager.FullName --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager install failed" }
          # build-android-arm64.bat and package-arm64.ps1 expect the SDK under %LOCALAPPDATA%\Android\Sdk
          $expected = Join-Path $env:LOCALAPPDATA "Android\Sdk"
          if (-not (Test-Path $expected)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            cmd /c mklink /J "$expected" "$sdkRoot" | Out-Host
          }

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Build native libraries and APK
        shell: cmd
        run: build-android-arm64.bat

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic4-arm64-v8a
          path: android/dist/Sonic4-arm64-v8a.apk
          if-no-files-found: error
